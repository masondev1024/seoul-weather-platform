[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "seoul-weather-platform"
version = "0.1.0"
description = "Weather pipeline, serving contracts, and K-Skill release artifacts for Seoul."
requires-python = ">=3.11,<3.12"

[project.optional-dependencies]
dev = [
  "pytest==9.0.3",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests", "release/weather/tests"]
