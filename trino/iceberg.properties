connector.name=iceberg

iceberg.catalog.type=rest
iceberg.rest-catalog.uri=${ENV:R2_DATA_CATALOG_URI}
iceberg.rest-catalog.warehouse=${ENV:R2_DATA_CATALOG_WAREHOUSE}
iceberg.rest-catalog.security=OAUTH2
iceberg.rest-catalog.oauth2.token=${ENV:R2_DATA_CATALOG_TOKEN}

fs.native-s3.enabled=true
s3.region=auto
s3.endpoint=${ENV:R2_ENDPOINT}
s3.path-style-access=true
s3.aws-access-key=${ENV:R2_ACCESS_KEY_ID}
s3.aws-secret-key=${ENV:R2_SECRET_ACCESS_KEY}

# fs 캐시 (ASK-Seoul#107): R2 반복 재읽기 제거 — 읽은 데이터 파일을 로컬 디스크에 캐시.
# Iceberg 파일은 불변(경로 재사용 없음)이라 stale read 가 구조적으로 불가능하고,
# 새 커밋 = 새 파일 = 캐시 미스라 최신성도 유지된다. 상한 20GB 는 dev 워킹셋
# ~8.5GB(2026-08-09 전수 실측) 대비 성장 여유. 디렉토리는 trino_cache named volume
# 이 /data/trino 에 마운트되어 영속(권한: 이미지의 trino 소유 경로 copy-up).
fs.cache.enabled=true
fs.cache.directories=/data/trino/cache
fs.cache.max-sizes=20GB
