#single node install config
coordinator=true
node-scheduler.include-coordinator=true
discovery.uri=http://localhost:8080
catalog.management=${ENV:CATALOG_MANAGEMENT}

# 저메모리 환경 안정성 — 파일시스템을 스왑처럼 사용(집계/조인/정렬/윈도우 spill).
# scan+project(detail 추출)은 spill 대상이 아니라 loader 의 동적 사이징이 담당한다(2계층 방어).
spill-enabled=true
spiller-spill-path=/tmp/trino-spill
memory-revoking-threshold=0.9
memory-revoking-target=0.7
# 풀이 고갈돼 쿼리들이 블록되면 **가장 많이 잡은 쿼리를 죽여 회복**한다.
# `none` 이면 아무도 안 죽고 전부 대기하다 GC 가 폭주해, 코디네이터가 자기 상태 announce 조차
# 못 하고 스스로 종료한다(ASK-Seoul#94 실측: 재시작 6회 · OOMKilled=false · ExitCode=0 —
# Docker 가 죽인 게 아니라 자멸). 서버가 죽으면 **전 도메인 쿼리가 한꺼번에** 실패하므로,
# 쿼리 하나가 실패하는 편이 낫다.
query.low-memory-killer.policy=total-reservation-on-blocked-nodes
# 노드별 병렬도 — compose 가 주입(기본 2 = 공유 VM 저사양 안전값). 고사양 노드는 host .env 에
# TRINO_TASK_CONCURRENCY=16 등으로 상향(반영은 trino 재시작 시). heap 은 MaxRAMPercentage(비율)라
# 머신 RAM 에 자동 비례 — 별도 조정 불필요.
task.concurrency=${ENV:TRINO_TASK_CONCURRENCY}

# 개인 Mac query memory 예산 — 최중량 transform query(725MiB)와 Silver
# contract test 피크(987MiB)를 관측한 뒤 per-node 800MB, query total
# 1200MB를 사용한다. Silver test의 불필요한 spill을 줄이되 두 branch의
# 동시 실행은 5GiB 컨테이너와 1.5GiB heap headroom 안에 남긴다. 상한을
# 올릴 때는 반드시 동일한 읽기 전용 벤치마크와 docker stats를 다시 남긴다.
query.max-memory-per-node=${ENV:TRINO_QUERY_MAX_MEMORY_PER_NODE}
memory.heap-headroom-per-node=${ENV:TRINO_MEMORY_HEAP_HEADROOM_PER_NODE}
query.max-memory=${ENV:TRINO_QUERY_MAX_MEMORY}
query.max-total-memory=${ENV:TRINO_QUERY_MAX_TOTAL_MEMORY}
