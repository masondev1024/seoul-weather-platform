version: 2

models:
  - name: gold_weather_place_forecast_change_daily
    description: 장소·예보일별 최근 두 KMA 발표를 비교해 기온·강수확률·첫 강수 예상시각의 수정 내역을 제공하는 공개 Gold 제품입니다.
    access: public
    config:
      contract:
        enforced: true
      meta:
        serving:
          enabled: true
          external: true
          contract_version: v1
          product_id: weather_place_forecast_change_daily
          display:
            title: 장소별 일별 날씨 전망 변화
            summary: 장소별 일자 예보를 최신 발표와 직전 발표로 비교해 바뀐 내용을 보여줍니다.
            caveat: 발표 시각이 바뀌면 이전 예보와 비교 결과도 달라질 수 있습니다.
            use_cases: ["날씨 전망 변경 내용 확인"]
          product_question: 서울 주요 장소의 오늘 예보는 직전 KMA 발표보다 어떻게 달라졌습니까?
          mcp_projection:
            schema_version: mcp-product-projection/v1
            operation:
              id: weather.compare_forecast_change_daily
              approval_status: approved
              execution_mode: catalog_only
            question_examples:
              - 서울역의 내일 예보는 직전 발표와 비교해 어떻게 바뀌었나요?
              - 이 장소의 강수확률이나 기온 예보 수정 내역을 알려주세요.
              - 여의도공원의 첫 강수 예상 시각이 이전 예보보다 달라졌나요?
          grain: place_id와 forecast_date마다 한 행 — 최신 발표와 직전 발표의 일별 비교.
          primary_key: [product_row_id]
          publication_mode: snapshot
          zero_policy: fail
          publication_trigger:
            schedule_cron: "0 * * * *"
          event_time: latest_issued_at
          freshness_field: latest_collected_at_max
          freshness_slo_minutes: 240
          retention_or_horizon: 게시 시점 기준 오늘 이후의 최신 예보 일자만 유지합니다.
          shape: wide
          source_evidence:
            - source_id: kma_vilage_fcst
              source_url: https://www.data.go.kr/data/15084084/openapi.do
              license: 공공누리 제1유형(출처표시)
              license_url: https://www.kogl.or.kr/info/licenseType1.do
              redistribution: allowed_with_attribution
              attribution: 기상청
              rights_checked_at: "2026-08-04"
          quality_coverage:
            field: admin_dong_code
            expected_distinct_count: 427
            minimum_ratio: 1.0
          # D1/클라이언트가 실행하는 카탈로그 참조 구현입니다.
          # verified_* 는 현재 prod D1 게시본에서 읽기 전용으로 실행한 근거이며, 새 메타데이터는 다음 exporter 게시 후 반영됩니다.
          usage_patterns:
            - {pattern_id: forecast_change_for_place_date, question_ko: "특정 장소·예보일에서 최신 발표는 직전 발표보다 어떻게 바뀌었습니까?", axes: "장소·예보일 필터 — 최신·직전 발표 변화 비교", requires: [select_columns], allow_empty: true, verified_rows: 1, verified_at: "2026-08-05T14:39:11Z", verified_publication_id: "b6e6bf6d46f044b18e483cd6a03dc6c8", sql: "SELECT place_name, admin_dong, gu, forecast_date, latest_issued_at, previous_issued_at, change_state, min_temp_change_c, max_temp_change_c, max_precip_prob_change_pct, latest_first_precipitation_at, previous_first_precipitation_at FROM gold_weather_place_forecast_change_daily WHERE place_id = :place_id AND forecast_date = :forecast_date -- :place_id='seoul_admd_1111051500', :forecast_date='2026-08-05'", param_defaults: {forecast_date: { rel: "0d", as: date }}}
            - {pattern_id: changed_forecasts_for_date, question_ko: "특정 예보일에 직전 발표와 달라진 장소의 예보는 무엇입니까?", axes: "예보일·changed 상태 필터 — 최신 발표 시각 DESC", requires: [select_columns, filter_set, sort], allow_empty: true, verified_rows: 51, verified_at: "2026-08-05T14:39:11Z", verified_publication_id: "b6e6bf6d46f044b18e483cd6a03dc6c8", sql: "SELECT place_id, place_name, gu, forecast_date, latest_issued_at, previous_issued_at, min_temp_change_c, max_temp_change_c, max_precip_prob_change_pct FROM gold_weather_place_forecast_change_daily WHERE forecast_date = :forecast_date AND change_state = 'changed' ORDER BY latest_issued_at DESC, place_name LIMIT :n -- :forecast_date='2026-08-05', :n=100", param_defaults: {forecast_date: { rel: "0d", as: date }, n: 100}}
            - {pattern_id: partial_comparison_forecasts, question_ko: "일부 카테고리만 비교 가능한 장소·예보일은 무엇입니까?", axes: "partial_comparison 상태 필터 — 최신 발표 시각 DESC", requires: [select_columns, filter_set, sort], allow_empty: true, verified_rows: 0, verified_at: "2026-08-05T14:39:11Z", verified_publication_id: "b6e6bf6d46f044b18e483cd6a03dc6c8", sql: "SELECT place_id, place_name, gu, forecast_date, latest_issued_at, previous_issued_at, latest_category_count, previous_category_count, change_state FROM gold_weather_place_forecast_change_daily WHERE forecast_date = :forecast_date AND change_state = 'partial_comparison' ORDER BY latest_issued_at DESC, place_name LIMIT :n -- :forecast_date='2026-08-05', :n=100", param_defaults: {forecast_date: { rel: "0d", as: date }, n: 100}}
            - {pattern_id: forecasts_without_previous_issue, question_ko: "직전 KMA 발표가 없어 비교할 수 없는 장소·예보일은 무엇입니까?", axes: "no_previous_issue 상태 필터 — 최신 발표 시각 DESC", requires: [select_columns, filter_set, sort], allow_empty: true, verified_rows: 0, verified_at: "2026-08-05T14:39:11Z", verified_publication_id: "b6e6bf6d46f044b18e483cd6a03dc6c8", sql: "SELECT place_id, place_name, gu, forecast_date, latest_issued_at, change_state, latest_category_count, latest_forecast_hour_count FROM gold_weather_place_forecast_change_daily WHERE forecast_date = :forecast_date AND change_state = 'no_previous_issue' ORDER BY latest_issued_at DESC, place_name LIMIT :n -- :forecast_date='2026-08-05', :n=100", param_defaults: {forecast_date: { rel: "0d", as: date }, n: 100}}
            - {pattern_id: largest_temperature_change, question_ko: "일별 최저·최고 기온 예보 변화 폭이 가장 큰 장소는 어디입니까?", axes: "changed 상태 필터 — 절대 기온 변화 DESC", requires: [select_columns, filter_set, sort], allow_empty: true, verified_rows: 20, verified_at: "2026-08-05T14:39:11Z", verified_publication_id: "b6e6bf6d46f044b18e483cd6a03dc6c8", sql: "SELECT place_id, place_name, gu, forecast_date, min_temp_change_c, max_temp_change_c, latest_issued_at, previous_issued_at FROM gold_weather_place_forecast_change_daily WHERE forecast_date = :forecast_date AND change_state = 'changed' ORDER BY max(abs(min_temp_change_c), abs(max_temp_change_c)) DESC, place_name LIMIT :n -- :forecast_date='2026-08-05', :n=20", param_defaults: {forecast_date: { rel: "0d", as: date }, n: 20}}
            - {pattern_id: largest_precip_probability_change, question_ko: "최대 강수확률 예보 변화 폭이 가장 큰 장소는 어디입니까?", axes: "changed 상태 필터 — 절대 강수확률 변화 DESC", requires: [select_columns, filter_set, sort], allow_empty: true, verified_rows: 20, verified_at: "2026-08-05T14:39:11Z", verified_publication_id: "b6e6bf6d46f044b18e483cd6a03dc6c8", sql: "SELECT place_id, place_name, gu, forecast_date, latest_max_precip_prob_pct, previous_max_precip_prob_pct, max_precip_prob_change_pct, latest_first_precipitation_at, previous_first_precipitation_at FROM gold_weather_place_forecast_change_daily WHERE forecast_date = :forecast_date AND change_state = 'changed' ORDER BY abs(max_precip_prob_change_pct) DESC, place_name LIMIT :n -- :forecast_date='2026-08-05', :n=20", param_defaults: {forecast_date: { rel: "0d", as: date }, n: 20}}
            - {pattern_id: forecast_change_for_gu, question_ko: "특정 자치구의 장소별 일별 예보 변경 내역은 무엇입니까?", axes: "자치구·예보일 필터 — 장소명 ASC", requires: [select_columns, filter_set, sort], allow_empty: true, verified_rows: 17, verified_at: "2026-08-05T14:39:11Z", verified_publication_id: "b6e6bf6d46f044b18e483cd6a03dc6c8", sql: "SELECT place_id, place_name, gu, forecast_date, change_state, min_temp_change_c, max_temp_change_c, max_precip_prob_change_pct FROM gold_weather_place_forecast_change_daily WHERE gu_code = :gu_code AND forecast_date = :forecast_date ORDER BY place_name LIMIT :n -- :gu_code='11110', :forecast_date='2026-08-05', :n=100", param_defaults: {forecast_date: { rel: "0d", as: date }, n: 100}}
            - {pattern_id: change_state_over_date_range, question_ko: "특정 예보일 범위에서 상태별 예보 변경 행 수는 얼마입니까?", axes: "예보일 범위·변경 상태 집계 — 행 수 DESC", requires: [select_columns, filter_range, aggregate, group_by, sort], allow_empty: true, verified_rows: 7, verified_at: "2026-08-05T14:39:11Z", verified_publication_id: "b6e6bf6d46f044b18e483cd6a03dc6c8", sql: "SELECT forecast_date, change_state, count(*) AS place_count FROM gold_weather_place_forecast_change_daily WHERE forecast_date >= :from_date AND forecast_date < :to_date GROUP BY forecast_date, change_state ORDER BY forecast_date ASC, place_count DESC, change_state -- :from_date='2026-08-05', :to_date='2026-08-10'", param_defaults: {from_date: { rel: "0d", as: date }, to_date: { rel: "+4d", as: date }}}
            - pattern_id: "forecast_change_timeline_for_place"
              question_ko: "특정 장소에서 예보 대상일별로 최신 발표가 직전 발표 대비 어떻게 달라졌는지 시간순으로 보고 싶습니다."
              axes: "장소 필터 — 예보일 시계열(forecast_date ASC)"
              verified_rows: 6
              verified_at: "2026-08-10T11:10:00Z"
              verified_publication_id: "293380934b9d4be1aa7ba9e69e1bb738"
              insight_sample_ko: "종로구 사직동은 6개 예보일 중 2026-08-08만 20시 발표에서 바뀌었고(최고기온 -3°C·최대강수확률 -20%p, 예보 시간 6→3시간), 08-09~08-13은 unchanged."
              sql: |
                -- :place_id=seoul_admd_1111053000
                SELECT place_id, place_name, gu, forecast_date, change_state, min_temp_change_c, max_temp_change_c, max_precip_prob_change_pct, latest_forecast_hour_count, previous_forecast_hour_count FROM gold_weather_place_forecast_change_daily WHERE place_id = :place_id ORDER BY forecast_date ASC
              requires: [select_columns, filter_set, sort]
              allow_empty: false
            - pattern_id: "temp_change_by_area_for_date"
              question_ko: "특정 예보일에 지역(자치구 또는 행정동)별로 최신 발표의 기온·강수확률 예보가 평균 얼마나 바뀌었습니까?"
              axes: "예보일 필터 · 지역 집계(차원 스위치) — 평균 변화(지표 스위치) ASC"
              verified_rows: 25
              verified_at: "2026-08-10T11:10:00Z"
              verified_publication_id: "293380934b9d4be1aa7ba9e69e1bb738"
              insight_sample_ko: "2026-08-08 발표에서 자치구별 평균 최고기온 하락이 가장 큰 곳은 동대문구로 15개 장소가 평균 -4.0°C(평균 최대강수확률 -20%p) 내려갔다."
              sql: |
                -- :forecast_date=2026-08-15, :dim=gu, :metric=max_temp, :n=25
                SELECT CASE :dim WHEN 'admin_dong' THEN admin_dong ELSE gu END AS area, count(*) AS place_count, sum(CASE WHEN change_state='changed' THEN 1 ELSE 0 END) AS changed_count, round(avg(max_temp_change_c),2) AS avg_max_temp_change_c, min(max_temp_change_c) AS min_max_temp_change_c, round(avg(max_precip_prob_change_pct),2) AS avg_max_precip_prob_change_pct FROM gold_weather_place_forecast_change_daily WHERE forecast_date = :forecast_date GROUP BY CASE :dim WHEN 'admin_dong' THEN admin_dong ELSE gu END ORDER BY CASE :metric WHEN 'max_precip' THEN avg_max_precip_prob_change_pct ELSE avg_max_temp_change_c END ASC, area LIMIT :n
              requires: [select_columns, filter_set, aggregate, group_by, sort]
              allow_empty: false
              param_defaults: { n: 25 , forecast_date: { rel: "0d", as: date } }
            - pattern_id: "forecast_movers_by_metric_direction"
              question_ko: "특정 예보일에 선택한 지표(최고기온/최저기온/최대강수확률)가 가장 크게 내려가거나 올라간 장소는 어디입니까? (자치구 지정 또는 전체)"
              axes: "예보일·자치구 센티널 필터 — 지표 변화(지표·방향 스위치) 정렬"
              verified_rows: 20
              verified_at: "2026-08-10T11:18:06Z"
              verified_publication_id: "293380934b9d4be1aa7ba9e69e1bb738"
              insight_sample_ko: "2026-08-08 발표에서 최고기온 예보가 가장 크게 내려간 장소는 송파구 가락1동으로 -4°C(최대강수확률 -20%p)."
              sql: |
                -- :forecast_date=2026-08-14, :metric=max_temp, :dir=asc, :gu=ALL, :n=20
                SELECT place_id, place_name, gu, forecast_date, change_state, min_temp_change_c, max_temp_change_c, max_precip_prob_change_pct, CASE :metric WHEN 'min_temp' THEN min_temp_change_c WHEN 'max_precip' THEN max_precip_prob_change_pct ELSE max_temp_change_c END AS metric_change FROM gold_weather_place_forecast_change_daily WHERE forecast_date = :forecast_date AND (:gu = 'ALL' OR gu = :gu) AND CASE :metric WHEN 'min_temp' THEN min_temp_change_c WHEN 'max_precip' THEN max_precip_prob_change_pct ELSE max_temp_change_c END <> 0 ORDER BY CASE WHEN :dir='asc' THEN CASE :metric WHEN 'min_temp' THEN min_temp_change_c WHEN 'max_precip' THEN max_precip_prob_change_pct ELSE max_temp_change_c END END ASC, CASE WHEN :dir='desc' THEN CASE :metric WHEN 'min_temp' THEN min_temp_change_c WHEN 'max_precip' THEN max_precip_prob_change_pct ELSE max_temp_change_c END END DESC, place_name LIMIT :n
              requires: [select_columns, filter_set, filter_range, sort]
              allow_empty: true   # 예보 변화 없는 창 0행 정상(방향 축)
              param_defaults: { gu: "ALL", dir: "asc", n: 20 , forecast_date: { rel: "+2d", as: date } }
              param_enum: { dir: [asc, desc] }
            - pattern_id: "forecasts_dropping_precipitation"
              question_ko: "직전 KMA 발표에는 강수 시작 시각이 있었으나 최신 발표에서 강수 예보가 사라진(비/눈 예보가 빠진) 장소는 어디입니까?"
              axes: "강수 시작 시각 NULL 전이 필터 — 강수확률 변화 ASC"
              verified_rows: 0
              verified_at: "2026-08-10T11:18:06Z"
              verified_publication_id: "293380934b9d4be1aa7ba9e69e1bb738"
              insight_sample_ko: "구로구 가리봉동은 직전 17시 발표엔 18:00 강수 시작 예보가 있었으나 20시 발표에서 강수 예보가 빠졌고, 최대강수확률이 60%→0%로 내려갔다."
              sql: |
                -- :n=100
                SELECT place_id, place_name, gu, forecast_date, previous_first_precipitation_at, latest_first_precipitation_at, previous_max_precip_prob_pct, latest_max_precip_prob_pct, max_precip_prob_change_pct FROM gold_weather_place_forecast_change_daily WHERE previous_first_precipitation_at IS NOT NULL AND latest_first_precipitation_at IS NULL ORDER BY max_precip_prob_change_pct ASC, place_name LIMIT :n
              requires: [select_columns, filter_null, sort]
              allow_empty: true   # 하향 예보 없으면 0행 정상(방향 축)
              param_defaults: { n: 100 }
            - pattern_id: "forecast_change_for_places"
              question_ko: "관심 장소 여러 곳을 골라 특정 예보일의 예보 변경 내역을 한 번에 비교하고 싶습니다."
              axes: "장소 배열·예보일 필터 — 장소명 ASC"
              verified_rows: 3
              verified_at: "2026-08-10T11:10:00Z"
              verified_publication_id: "293380934b9d4be1aa7ba9e69e1bb738"
              insight_sample_ko: "지정한 3개 장소(청운효자동·사직동·삼청동)의 2026-08-08 예보 변경 중 사직동은 최고기온 -3°C·최대강수확률 -20%p(20시 발표 vs 17시 발표)."
              param_defaults: { forecast_date: { rel: "0d", as: date } }
              sql: |
                -- :place_ids=["seoul_admd_1174070000", "seoul_admd_1174069000", "seoul_admd_1174068500"], :forecast_date=2026-08-15
                SELECT place_id, place_name, gu, forecast_date, change_state, min_temp_change_c, max_temp_change_c, max_precip_prob_change_pct, latest_issued_at, previous_issued_at FROM gold_weather_place_forecast_change_daily WHERE forecast_date = :forecast_date AND place_id IN (SELECT value FROM json_each(:place_ids)) ORDER BY place_name
              requires: [select_columns, filter_set, sort]
              allow_empty: false
            - pattern_id: "change_intensity_over_date_range"
              question_ko: "특정 예보일 범위에서 날짜별 예보 변경 강도(변경 장소 수·평균 최고기온 하락폭·평균 최대강수확률 변화)는 어떻게 됩니까?"
              axes: "예보일 범위 집계 — 날짜별 변화 강도, forecast_date ASC"
              verified_rows: 4
              verified_at: "2026-08-10T11:10:00Z"
              verified_publication_id: "293380934b9d4be1aa7ba9e69e1bb738"
              insight_sample_ko: "2026-08-08 예보일은 427곳 전부가 변경되어 평균 최고기온 -3.56°C·평균 최대강수확률 -28.43%p(최소 -60%p) 내려갔고, 08-09 이후는 변화가 없었다."
              param_defaults: { from_date: { rel: "0d", as: date }, to_date: { rel: "+4d", as: date } }
              sql: |
                -- :from_date=2026-08-08, :to_date=2026-08-14
                SELECT forecast_date, count(*) AS place_count, sum(CASE WHEN change_state='changed' THEN 1 ELSE 0 END) AS changed_count, round(avg(max_temp_change_c),2) AS avg_max_temp_change_c, min(max_temp_change_c) AS min_max_temp_change_c, round(avg(max_precip_prob_change_pct),2) AS avg_max_precip_prob_change_pct, min(max_precip_prob_change_pct) AS min_max_precip_prob_change_pct FROM gold_weather_place_forecast_change_daily WHERE forecast_date >= :from_date AND forecast_date < :to_date GROUP BY forecast_date ORDER BY forecast_date ASC
              requires: [select_columns, filter_range, aggregate, group_by, sort]
              allow_empty: false
          public_projection:
            schema_version: "1.1.0"
