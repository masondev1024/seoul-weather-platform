version: 2

models:
  - name: gold_weather_place_risk_window
    description: 장소별 폭염·한파·호우·대설·강풍 후보를 설명 가능한 임계값으로 선별한 공개 Gold 제품입니다. 기상청 공식 특보가 아닙니다.
    access: public
    config:
      meta:
        serving:
          enabled: true
          external: true
          contract_version: v1
          product_id: weather_place_risk_window
          display:
            title: 장소별 기상 위험 예상 시간대
            summary: 장소별로 이동·방문 시 주의가 필요한 기상 위험 예보 시간대를 보여줍니다.
            caveat: 예보값 임계치 기반 참고 정보이며 공식 기상특보가 아닙니다.
            use_cases: ["야외 활동 전 기상 위험 확인"]
          product_question: 서울 주요 장소 중 방문·이동 주의가 필요할 수 있는 예보 시간과 근거는 무엇입니까?
          mcp_projection:
            empty_result:
              state: valid_empty
              code: no_upcoming_weather_risk_candidate
              message_ko: 현재 수집된 유효 단기예보에는 설정된 기준을 충족한 향후 기상 위험 후보 구간이 없습니다.
            schema_version: mcp-product-projection/v1
            operation:
              id: weather.find_risk_windows
              approval_status: approved
              execution_mode: catalog_only
            question_examples:
              - 서울역에서 이동에 주의가 필요할 수 있는 예보 시간은 언제인가요?
              - 이 장소에 폭염·강풍·호우 후보가 예보된 시간과 근거를 알려주세요.
              - 내일 여의도공원을 방문할 때 참고할 위험 예보가 있나요?
          grain: place_id와 forecast_at마다 한 행 — 자체 임계값을 만족한 후보 위험 예보.
          primary_key: [product_row_id]
          publication_mode: snapshot
          zero_policy: allow
          publication_trigger:
            schedule_cron: "0 * * * *"
          event_time: forecast_at
          freshness_field: forecast_collected_at_max
          freshness_slo_minutes: 240
          empty_result_freshness:
            relation: gold_weather_place_hourly_outlook
            field: forecast_collected_at_max
          query_availability:
            relation: gold_weather_place_risk_query_availability
          quality_coverage:
            not_applicable_reason: 위험 조건을 충족한 장소·예보시각만 게시하는 희소 이벤트 제품이므로, 게시 행의 place_id 수는 전체 장소 모집단의 커버리지를 뜻하지 않습니다.
          retention_or_horizon: 최신 KMA 예보가 제공하는 미래 구간만 매 게시 시점에 교체합니다.
          shape: event
          source_evidence:
            - source_id: kma_vilage_fcst
              source_url: https://www.data.go.kr/data/15084084/openapi.do
              license: 공공누리 제1유형(출처표시)
              license_url: https://www.kogl.or.kr/info/licenseType1.do
              redistribution: allowed_with_attribution
              attribution: 기상청
              rights_checked_at: "2026-08-06"
          usage_patterns:
            - pattern_id: risk_windows_for_place
              question_ko: 특정 장소에서 자체 임계값을 만족한 위험 후보 예보는 언제입니까?
              axes: 장소 필터 — 예보 대상 시각 ASC
              requires: [select_columns, filter_set, sort]
              allow_empty: true
              verified_rows: 66
              verified_at: "2026-08-05T14:39:11Z"
              verified_publication_id: "e55bd4bc32cf4af7b95fd7009d980975"
              sql: |
                -- :place_id='seoul_admd_1120062000'
                SELECT place_id, forecast_at, risk_labels
                FROM gold_weather_place_risk_window
                WHERE place_id = :place_id
                ORDER BY forecast_at ASC
            - pattern_id: upcoming_risk_windows
              question_ko: 특정 시간 범위에 위험 후보가 예보된 장소·시각은 무엇입니까?
              axes: 예보 대상 시각 범위 필터 — 시간 ASC
              requires: [select_columns, filter_range, sort]
              param_defaults: { n: 100, from_at: { rel: "0d", as: datetime }, to_at: { rel: "+2d", as: datetime } }
              allow_empty: true
              verified_rows: 100
              verified_at: "2026-08-05T14:39:11Z"
              verified_publication_id: "e55bd4bc32cf4af7b95fd7009d980975"
              sql: |
                -- :from_at='2026-07-30 00:00:00', :to_at='2026-08-06 00:00:00', :n=100
                SELECT place_id, forecast_at, risk_labels
                FROM gold_weather_place_risk_window
                WHERE forecast_at >= :from_at AND forecast_at < :to_at
                ORDER BY forecast_at ASC, place_id
                LIMIT :n
            - pattern_id: risk_label_candidates
              question_ko: 특정 위험 후보 라벨을 포함한 장소·시각은 무엇입니까?
              axes: 위험 후보 라벨 포함 필터 — 예보 대상 시각 ASC
              requires: [select_columns, filter_set, sort]
              param_defaults: { n: 100 }
              allow_empty: true
              verified_rows: 100
              verified_at: "2026-08-05T14:39:11Z"
              verified_publication_id: "e55bd4bc32cf4af7b95fd7009d980975"
              sql: |
                -- :risk_label='폭염후보', :n=100
                SELECT place_id, forecast_at, risk_labels
                FROM gold_weather_place_risk_window
                WHERE risk_labels LIKE '%' || :risk_label || '%'
                ORDER BY forecast_at ASC, place_id
                LIMIT :n
            - pattern_id: risk_candidates_for_place_window
              question_ko: 특정 장소의 방문 시간 범위에 위험 후보 예보가 있습니까?
              axes: 장소·예보 대상 시각 범위 필터 — 시간 ASC
              requires: [select_columns, filter_set, filter_range, sort]
              param_defaults: { from_at: { rel: "0d", as: datetime }, to_at: { rel: "+2d", as: datetime } }
              allow_empty: true
              verified_rows: 45
              verified_at: "2026-08-05T14:39:11Z"
              verified_publication_id: "e55bd4bc32cf4af7b95fd7009d980975"
              sql: |
                -- :place_id='seoul_admd_1120062000', :from_at='2026-07-30 00:00:00', :to_at='2026-08-06 00:00:00'
                SELECT place_id, forecast_at, risk_labels
                FROM gold_weather_place_risk_window
                WHERE place_id = :place_id
                  AND forecast_at >= :from_at AND forecast_at < :to_at
                ORDER BY forecast_at ASC
            - pattern_id: next_risk_candidate_for_place
              question_ko: 특정 장소의 다음 위험 후보 예보 시각과 근거는 무엇입니까?
              axes: 장소·기준 시각 필터 — 예보 대상 시각 ASC, 1건
              requires: [select_columns, filter_set, filter_range, sort]
              allow_empty: true
              verified_rows: 1
              verified_at: "2026-08-05T14:39:11Z"
              verified_publication_id: "e55bd4bc32cf4af7b95fd7009d980975"
              param_defaults: { as_of_at: { rel: "0d", as: datetime } }
              sql: |
                -- :place_id='seoul_admd_1120062000', :as_of_at='2026-07-30 00:00:00'
                SELECT place_id, forecast_at, risk_labels
                FROM gold_weather_place_risk_window
                WHERE place_id = :place_id AND forecast_at >= :as_of_at
                ORDER BY forecast_at ASC
                LIMIT 1
            - pattern_id: multi_risk_label_candidates
              question_ko: 한 시각에 둘 이상의 위험 후보 라벨이 함께 나타난 장소는 어디입니까?
              axes: 복수 위험 후보 라벨 필터 — 예보 대상 시각 ASC
              requires: [select_columns, filter_set, sort]
              param_defaults: { n: 100 }
              allow_empty: true
              verified_rows: 0
              verified_at: "2026-08-05T14:39:11Z"
              verified_publication_id: "e55bd4bc32cf4af7b95fd7009d980975"
              sql: |
                -- :n=100
                SELECT place_id, forecast_at, risk_labels
                FROM gold_weather_place_risk_window
                WHERE risk_labels LIKE '%,%'
                ORDER BY forecast_at ASC, place_id
                LIMIT :n
            - pattern_id: latest_risk_candidates
              question_ko: 가장 먼 미래 시각까지 이어지는 위험 후보 예보는 무엇입니까?
              axes: 예보 대상 시각 정렬 — forecast_at DESC
              requires: [select_columns, sort]
              param_defaults: { n: 20 }
              allow_empty: true
              verified_rows: 20
              verified_at: "2026-08-05T14:39:11Z"
              verified_publication_id: "e55bd4bc32cf4af7b95fd7009d980975"
              sql: |
                -- :n=20
                SELECT place_id, forecast_at, risk_labels
                FROM gold_weather_place_risk_window
                ORDER BY forecast_at DESC, place_id
                LIMIT :n
            - pattern_id: risk_candidate_count_by_place
              question_ko: 특정 시간 범위에서 장소별 위험 후보 예보 건수는 얼마입니까?
              axes: 예보 대상 시각 범위 집계 — 위험 후보 수 DESC
              requires: [select_columns, filter_range, aggregate, group_by, sort]
              param_defaults: { n: 100, from_at: { rel: "0d", as: datetime }, to_at: { rel: "+2d", as: datetime } }
              allow_empty: true
              verified_rows: 100
              verified_at: "2026-08-05T14:39:11Z"
              verified_publication_id: "e55bd4bc32cf4af7b95fd7009d980975"
              sql: |
                -- :from_at='2026-07-30 00:00:00', :to_at='2026-08-06 00:00:00', :n=100
                SELECT place_id, count(*) AS risk_candidate_count
                FROM gold_weather_place_risk_window
                WHERE forecast_at >= :from_at AND forecast_at < :to_at
                GROUP BY place_id
                ORDER BY risk_candidate_count DESC, place_id
                LIMIT :n
            - pattern_id: "place_risk_forecast_timeline"
              question_ko: "특정 장소의 위험 후보 예보를 시간순으로 볼 때 기온·풍속·강수확률과 위험 플래그는 어떻게 이어집니까?"
              axes: "장소 필터 — 예보 시각 ASC로 측정값·위험 플래그 시계열"
              verified_rows: 18
              verified_at: "2026-08-10T11:10:00Z"
              verified_publication_id: "792f479e368744bfaccb67932687dee2"
              insight_sample_ko: "송파구 방이2동은 2026-08-08 11시부터 총 17개 예보 시각이 폭염후보이며, 첫 시각 기온 33도·풍속 4.0 m/s·강수확률 0%였다."
              sql: |
                -- :place_id=seoul_admd_1171056200
                SELECT place_id, place_name, gu, forecast_at, temp_c, wind_ms, precip_prob_pct, pty_code, heat_risk, cold_risk, heavy_rain_risk, snow_risk, wind_risk, risk_labels
                FROM gold_weather_place_risk_window
                WHERE place_id = :place_id
                ORDER BY forecast_at ASC
              requires: [select_columns, filter_set, sort]
              allow_empty: false
            - pattern_id: "top_places_by_metric_at_time"
              question_ko: "특정 예보 시각에 (기온/풍속/강수확률 중 고른 지표로) 가장 높거나 낮은 위험 후보 장소는 어디입니까?"
              axes: "예보 시각·자치구 센티널 필터 — 선택 지표를 선택 방향으로 정렬한 단면 랭킹"
              verified_rows: 15
              verified_at: "2026-08-10T11:10:00Z"
              verified_publication_id: "792f479e368744bfaccb67932687dee2"
              insight_sample_ko: "2026-08-08 15시 예보에서 풍속이 가장 높은 위험 후보 장소는 강동구 강일동(풍속 5.2 m/s, 기온 35도)이었다."
              sql: |
                -- :forecast_at=2026-08-11 15:00:00, :gu=ALL, :metric=wind_ms, :dir=desc, :n=15
                SELECT place_id, place_name, gu, forecast_at, temp_c, wind_ms, precip_prob_pct, pty_code
                FROM gold_weather_place_risk_window
                WHERE forecast_at = :forecast_at
                  AND (:gu = 'ALL' OR gu = :gu)
                ORDER BY CASE WHEN :dir='asc' THEN (CASE :metric WHEN 'temp_c' THEN temp_c WHEN 'wind_ms' THEN wind_ms ELSE precip_prob_pct END) END ASC,
                         CASE WHEN :dir='desc' THEN (CASE :metric WHEN 'temp_c' THEN temp_c WHEN 'wind_ms' THEN wind_ms ELSE precip_prob_pct END) END DESC,
                         place_name
                LIMIT :n
              requires: [select_columns, filter_set, sort]
              allow_empty: false
              param_defaults: { gu: "ALL", dir: "desc", n: 15 }
              param_enum: { dir: [asc, desc] }
            - pattern_id: "peak_temp_by_place"
              question_ko: "예보 기간 동안 예보 최고기온이 지정 임계값 이상으로 가장 높았던 위험 후보 장소는 어디입니까?"
              axes: "예보 시각 범위 필터 + 장소 집계 — 최고기온 임계값(HAVING) 후 peak_temp DESC"
              verified_rows: 20
              verified_at: "2026-08-10T11:10:00Z"
              verified_publication_id: "792f479e368744bfaccb67932687dee2"
              insight_sample_ko: "2026-08-07~12 예보 창에서 예보 최고기온 36도로 가장 높은 축에 든 장소에는 종로구 가회동이 포함됐고, 해당 장소의 폭염후보 예보 시각은 4건이었다."
              sql: |
                -- :from_at=2026-08-07 00:00:00, :to_at=2026-08-13 00:00:00, :min_peak_temp=35, :n=20
                SELECT place_id, place_name, gu, max(temp_c) AS peak_temp_c, max(wind_ms) AS peak_wind_ms, count(*) AS risk_hour_count
                FROM gold_weather_place_risk_window
                WHERE forecast_at >= :from_at AND forecast_at < :to_at
                GROUP BY place_id, place_name, gu
                HAVING max(temp_c) >= :min_peak_temp
                ORDER BY peak_temp_c DESC, risk_hour_count DESC, place_name
                LIMIT :n
              requires: [select_columns, filter_range, aggregate, group_by, having, sort]
              allow_empty: true   # 폭염 임계 미도달 기간 0행 정상
              param_defaults: { min_peak_temp: 35, n: 20, from_at: { rel: "0d", as: datetime }, to_at: { rel: "+2d", as: datetime } }
            - pattern_id: "risk_exposure_by_area"
              question_ko: "예보 기간 동안 위험 후보 노출(예보 건수·장소 수·최고기온)이 큰 지역은 자치구/행정동 중 어느 단위로 보든 어디입니까?"
              axes: "예보 시각 범위 필터 + 지역 차원 스위치(자치구/행정동) 집계 — 위험 건수 DESC"
              verified_rows: 25
              verified_at: "2026-08-10T11:14:34Z"
              verified_publication_id: "792f479e368744bfaccb67932687dee2"
              insight_sample_ko: "2026-08-08 하루 예보 기준 폭염후보 예보 건수가 가장 많은 자치구는 송파구로, 126건·장소 20곳·최고기온 35도·최고풍속 5.6 m/s였다."
              sql: |
                -- :dim=gu, :from_at=2026-08-09 13:00:00, :to_at=2026-08-14 15:00:00, :n=25
                SELECT CASE :dim WHEN 'gu' THEN gu ELSE admin_dong END AS area, count(*) AS risk_hour_count, count(DISTINCT place_id) AS place_count, max(temp_c) AS peak_temp_c, max(wind_ms) AS peak_wind_ms
                FROM gold_weather_place_risk_window
                WHERE forecast_at >= :from_at AND forecast_at < :to_at
                GROUP BY CASE :dim WHEN 'gu' THEN gu ELSE admin_dong END
                ORDER BY risk_hour_count DESC, area
                LIMIT :n
              requires: [select_columns, filter_range, aggregate, group_by, sort]
              allow_empty: false
              param_defaults: { n: 25, from_at: { rel: "0d", as: datetime }, to_at: { rel: "+2d", as: datetime } }
            - pattern_id: "risk_load_by_forecast_time"
              question_ko: "예보 기간 안에서 위험 후보로 표시된 장소 수와 최고기온이 예보 시각마다 어떻게 달라집니까?"
              axes: "예보 시각 범위 필터 + 예보 시각 집계 — 시각 ASC 시계열(장소 수·최고기온·최고풍속·최고강수확률)"
              verified_rows: 22
              verified_at: "2026-08-10T11:14:34Z"
              verified_publication_id: "792f479e368744bfaccb67932687dee2"
              insight_sample_ko: "2026-08-08 예보 창의 첫 시각 11시에는 39개 장소가 폭염후보로 표시됐고 그 시각 최고기온은 33도였다."
              sql: |
                -- :from_at=2026-08-09 13:00:00, :to_at=2026-08-14 15:00:00
                SELECT forecast_at, count(DISTINCT place_id) AS place_count, max(temp_c) AS peak_temp_c, max(wind_ms) AS peak_wind_ms, max(precip_prob_pct) AS peak_precip_prob_pct
                FROM gold_weather_place_risk_window
                WHERE forecast_at >= :from_at AND forecast_at < :to_at
                GROUP BY forecast_at
                ORDER BY forecast_at ASC
              requires: [select_columns, filter_range, aggregate, group_by, sort]
              allow_empty: false
              param_defaults: { from_at: { rel: "0d", as: datetime }, to_at: { rel: "+2d", as: datetime } }
            - pattern_id: "risk_windows_for_gu_set"
              question_ko: "선택한 여러 자치구의 위험 후보 예보를 한 시간 범위에서 함께 보고 싶습니다."
              axes: "자치구 다중 선택(배열 IN) + 예보 시각 범위 필터 — 자치구·시각 ASC"
              verified_rows: 100
              verified_at: "2026-08-10T11:14:34Z"
              verified_publication_id: "792f479e368744bfaccb67932687dee2"
              insight_sample_ko: "강남·송파 두 자치구의 2026-08-08 폭염후보 예보를 모으면 상한 100건에 걸렸고, 첫 행은 강남구 개포2동 11시(기온 33도·강수확률 0%)였다."
              sql: |
                -- :gus=["송파구", "강남구", "강서구"], :from_at=2026-08-09 13:00:00, :to_at=2026-08-14 15:00:00, :n=100
                SELECT place_id, place_name, gu, forecast_at, temp_c, wind_ms, precip_prob_pct, pty_code
                FROM gold_weather_place_risk_window
                WHERE gu IN (SELECT value FROM json_each(:gus))
                  AND forecast_at >= :from_at AND forecast_at < :to_at
                ORDER BY gu, forecast_at ASC, place_name
                LIMIT :n
              requires: [select_columns, filter_set, filter_range, subquery, sort]
              allow_empty: false
              param_defaults: { n: 100, from_at: { rel: "0d", as: datetime }, to_at: { rel: "+2d", as: datetime } }
            - pattern_id: "high_precip_probability_windows"
              question_ko: "폭염 후보 예보 중에서도 강수확률이 지정 하한 이상으로 높아 소나기가 겹칠 수 있는 장소·시각은 무엇입니까?"
              axes: "강수확률 하한 + 예보 시각 범위 필터 — 강수확률 DESC"
              verified_rows: 50
              verified_at: "2026-08-10T11:10:00Z"
              verified_publication_id: "792f479e368744bfaccb67932687dee2"
              insight_sample_ko: "폭염후보 예보 중 강수확률 20% 이상 상위는 강수확률 60%·강수형태 4(소나기) 구간에 몰렸고, 송파구 가락1동 2026-08-08 17시(기온 34도·풍속 5.1 m/s)가 그 예다."
              sql: |
                -- :min_precip_prob_pct=20, :from_at=2026-08-07 00:00:00, :to_at=2026-08-13 00:00:00, :n=50
                SELECT place_id, place_name, gu, forecast_at, precip_prob_pct, pty_code, temp_c, wind_ms
                FROM gold_weather_place_risk_window
                WHERE precip_prob_pct >= :min_precip_prob_pct
                  AND forecast_at >= :from_at AND forecast_at < :to_at
                ORDER BY precip_prob_pct DESC, forecast_at ASC, place_name
                LIMIT :n
              requires: [select_columns, filter_range, sort]
              allow_empty: false
              param_defaults: { min_precip_prob_pct: 20, n: 50, from_at: { rel: "0d", as: datetime }, to_at: { rel: "+2d", as: datetime } }
            - pattern_id: "temp_severity_distribution"
              question_ko: "예보 기간 동안 위험 후보 예보가 예보 기온대별로 얼마나 분포합니까?"
              axes: "예보 시각 범위 필터 + 기온 집계 — 기온대별 예보 건수·장소 수 분포(기온 DESC)"
              verified_rows: 3
              verified_at: "2026-08-10T11:10:00Z"
              verified_publication_id: "792f479e368744bfaccb67932687dee2"
              insight_sample_ko: "2026-08-07~12 예보 창에서 최고기온대인 36도 구간은 예보 43건(장소 43곳, 예보 시각 1개)으로 폭염 정점 구간이었다."
              sql: |
                -- :from_at=2026-08-07 00:00:00, :to_at=2026-08-13 00:00:00
                SELECT temp_c, count(*) AS risk_hour_count, count(DISTINCT place_id) AS place_count, count(DISTINCT forecast_at) AS forecast_hour_count
                FROM gold_weather_place_risk_window
                WHERE forecast_at >= :from_at AND forecast_at < :to_at
                GROUP BY temp_c
                ORDER BY temp_c DESC
              requires: [select_columns, filter_range, aggregate, group_by, sort]
              allow_empty: false
              param_defaults: { from_at: { rel: "0d", as: datetime }, to_at: { rel: "+2d", as: datetime } }
          public_projection:
            schema_version: "1.2.0"
            columns:
              - product_row_id
              - place_id
              - place_name
              - admin_dong_code
              - admin_dong
              - gu_code
              - gu
              - forecast_at
              - temp_c
              - wind_ms
              - precip_prob_pct
              - pty_code
              - pcp_mm
              - sno_cm
              - heat_risk
              - cold_risk
              - heavy_rain_risk
              - snow_risk
              - wind_risk
              - risk_labels
              - forecast_issued_at_min
              - forecast_issued_at_max
              - forecast_collected_at_max
    columns:
      - name: product_row_id
        description: place_id와 예보시각을 직렬화한 식별자입니다.
        data_type: varchar
        tests: [not_null, unique]
        config:
          meta:
            semantic_role: primary_key
            nullable: false
            null_meaning: product_row_id 값이 없는 행은 이 공개 제품 계약에서 허용하지 않습니다.
            unit: not_applicable
      - name: place_id
        description: 장소 식별자입니다.
        data_type: varchar
        tests: [not_null]
        config:
          meta:
            semantic_role: join_key
            nullable: false
            null_meaning: place_id 값이 없는 행은 이 공개 제품 계약에서 허용하지 않습니다.
            unit: not_applicable
      - name: place_name
        description: 장소명입니다(장소 매핑에서 승계).
        data_type: varchar
        tests: [not_null]
        config:
          meta:
            semantic_role: descriptive_attribute
            nullable: false
            null_meaning: 매핑된 장소는 이름을 보존하므로 null을 허용하지 않습니다.
            unit: not_applicable
      - name: admin_dong_code
        description: 이 장소가 속한 행정동 10자리 코드입니다(장소 매핑에서 승계, 별도 공간 계약 없음).
        data_type: varchar
        tests: [not_null]
        config:
          meta:
            semantic_role: spatial_reference
            nullable: false
            null_meaning: 매핑된 장소는 행정동 코드를 보존하므로 null을 허용하지 않습니다.
            unit: not_applicable
      - name: admin_dong
        description: 행정동명입니다(장소 매핑에서 승계).
        data_type: varchar
        tests: [not_null]
        config:
          meta:
            semantic_role: spatial_reference
            nullable: false
            null_meaning: 매핑된 장소는 행정동명을 보존하므로 null을 허용하지 않습니다.
            unit: not_applicable
      - name: gu_code
        description: 자치구 5자리 코드입니다(장소 매핑에서 승계).
        data_type: varchar
        tests: [not_null]
        config:
          meta:
            semantic_role: spatial_reference
            nullable: false
            null_meaning: 매핑된 장소는 자치구 코드를 보존하므로 null을 허용하지 않습니다.
            unit: not_applicable
      - name: gu
        description: 자치구명입니다(장소 매핑에서 승계). 같은 행정동명이 여러 자치구에 있을 때 구분에 사용합니다.
        data_type: varchar
        tests: [not_null]
        config:
          meta:
            semantic_role: spatial_reference
            nullable: false
            null_meaning: 매핑된 장소는 자치구명을 보존하므로 null을 허용하지 않습니다.
            unit: not_applicable
      - name: forecast_at
        description: 후보 위험이 적용되는 KST 예보 시각입니다.
        data_type: timestamp(6)
        tests: [not_null]
        config:
          meta:
            semantic_role: timestamp
            nullable: false
            null_meaning: forecast_at 값이 없는 행은 이 공개 제품 계약에서 허용하지 않습니다.
            unit: not_applicable
      - name: temp_c
        description: 이 예보시각의 기온입니다. 폭염·한파 후보 판정의 근거값입니다.
        data_type: double
        config:
          meta:
            semantic_role: analytical_value
            nullable: true
            null_meaning: 해당 장소·예보시각에 TMP 카테고리가 없어 결측된 경우입니다.
            unit: celsius
      - name: wind_ms
        description: 이 예보시각의 풍속입니다. 강풍 후보 판정의 근거값입니다.
        data_type: double
        config:
          meta:
            semantic_role: analytical_value
            nullable: true
            null_meaning: 해당 장소·예보시각에 WSD 카테고리가 없어 결측된 경우입니다.
            unit: meter_per_second
      - name: precip_prob_pct
        description: 이 예보시각의 강수확률입니다. 위험 후보 판정에는 쓰지 않는 참고 근거값입니다.
        data_type: double
        config:
          meta:
            semantic_role: analytical_value
            nullable: true
            null_meaning: 해당 장소·예보시각에 POP 카테고리가 없어 결측된 경우입니다.
            unit: percent
      - name: pty_code
        description: KMA 강수형태 코드입니다. 호우 후보 판정의 근거값입니다.
        data_type: varchar
        tests:
          - accepted_values:
              arguments:
                values: ['0', '1', '2', '3', '4', '5', '6', '7']
        config:
          meta:
            semantic_role: categorical_value
            nullable: true
            null_meaning: 해당 장소·예보시각에 PTY 카테고리가 없어 결측된 경우입니다.
            unit: not_applicable
      - name: pcp_mm
        description: PCP 원문에서 숫자로 파싱 가능했던 강수량(mm)입니다. 호우 후보 판정의 근거값입니다.
        data_type: double
        config:
          meta:
            semantic_role: analytical_value
            nullable: true
            null_meaning: PCP 카테고리가 없거나 원문이 숫자로 파싱되지 않는 표현(범위·없음 등)인 경우입니다.
            unit: millimeter
      - name: sno_cm
        description: SNO 원문에서 숫자로 파싱 가능했던 적설량(cm)입니다. 대설 후보 판정의 근거값입니다.
        data_type: double
        config:
          meta:
            semantic_role: analytical_value
            nullable: true
            null_meaning: SNO 카테고리가 없거나 원문이 숫자로 파싱되지 않는 표현(범위·없음 등)인 경우입니다.
            unit: centimeter
      - name: heat_risk
        description: temp_c가 33도 이상인지 나타내는 폭염 후보 플래그입니다. 공식 폭염특보가 아닙니다.
        data_type: boolean
        config:
          meta:
            semantic_role: derived_flag
            nullable: true
            null_meaning: temp_c가 결측이면 임계값을 판정하지 않고 null로 둡니다.
            unit: not_applicable
      - name: cold_risk
        description: temp_c가 영하 12도 이하인지 나타내는 한파 후보 플래그입니다. 공식 한파특보가 아닙니다.
        data_type: boolean
        config:
          meta:
            semantic_role: derived_flag
            nullable: true
            null_meaning: temp_c가 결측이면 임계값을 판정하지 않고 null로 둡니다.
            unit: not_applicable
      - name: heavy_rain_risk
        description: pty_code가 비 계열(1·4·5)이고 pcp_mm이 15mm 이상인지 나타내는 호우 후보 플래그입니다. 공식 호우특보가 아닙니다.
        data_type: boolean
        config:
          meta:
            semantic_role: derived_flag
            nullable: true
            null_meaning: pty_code가 결측이면 임계값을 판정하지 않고 null로 둡니다.
            unit: not_applicable
      - name: snow_risk
        description: sno_cm이 1cm 이상인지 나타내는 대설 후보 플래그입니다. 공식 대설특보가 아닙니다.
        data_type: boolean
        config:
          meta:
            semantic_role: derived_flag
            nullable: false
            null_meaning: sno_cm 결측은 0으로 보정해 판정하므로 null이 발생하지 않습니다.
            unit: not_applicable
      - name: wind_risk
        description: wind_ms가 초속 14m 이상인지 나타내는 강풍 후보 플래그입니다. 공식 강풍특보가 아닙니다.
        data_type: boolean
        config:
          meta:
            semantic_role: derived_flag
            nullable: true
            null_meaning: wind_ms가 결측이면 임계값을 판정하지 않고 null로 둡니다.
            unit: not_applicable
      - name: risk_labels
        description: 자체 임계값을 만족한 설명용 후보 목록이며 공식 특보가 아닙니다.
        data_type: varchar
        tests: [not_null]
        config:
          meta:
            semantic_role: descriptive_attribute
            nullable: false
            null_meaning: risk_labels 값이 없는 행은 이 공개 제품 계약에서 허용하지 않습니다.
            unit: not_applicable
      - name: forecast_issued_at_min
        description: 이 예보시각을 구성하는 카테고리들의 KMA 발표시각 중 가장 이른 값입니다.
        data_type: timestamp(6)
        tests: [not_null]
        config:
          meta:
            semantic_role: timestamp
            nullable: false
            null_meaning: 발표시각이 없는 행은 최신 예보를 결정할 수 없습니다.
            time_role: issue_min
            timezone: Asia/Seoul
            unit: not_applicable
      - name: forecast_issued_at_max
        description: 이 예보시각을 구성하는 카테고리들의 KMA 발표시각 중 가장 늦은 값입니다.
        data_type: timestamp(6)
        tests: [not_null]
        config:
          meta:
            semantic_role: timestamp
            nullable: false
            null_meaning: 발표시각이 없는 행은 최신 예보를 결정할 수 없습니다.
            time_role: issue_max
            timezone: Asia/Seoul
            unit: not_applicable
      - name: forecast_collected_at_max
        description: 이 위험 후보 행을 구성한 원천 예보 중 가장 늦은 수집 시각입니다. 예보 대상 시각과 별도의 서빙 freshness 축입니다.
        data_type: timestamp(6)
        tests: [not_null]
        config:
          meta:
            semantic_role: timestamp
            nullable: false
            null_meaning: 원천 예보 수집 시각이 없으면 freshness를 판정할 수 없어 허용하지 않습니다.
            time_role: latest_collection
            timezone: Asia/Seoul
            unit: not_applicable
