version: 2

models:
  - name: gold_weather_place_precipitation_window
    description: 장소별로 연속된 강수 형태 예보 시간을 묶은 공개 Gold 제품입니다. 실제 강수 관측이나 발생 보장이 아닙니다.
    access: public
    config:
      meta:
        serving:
          enabled: true
          external: true
          contract_version: v1
          product_id: weather_place_precipitation_window
          display:
            title: 장소별 강수 예상 시간대
            summary: 장소별로 비나 눈이 이어질 것으로 예보된 시간 구간을 보여줍니다.
            caveat: 강수 예보 구간이며 실제 강수 발생을 보장하지 않습니다.
            use_cases: ["외출 시간대 날씨 참고"]
          product_question: 서울 주요 장소 중 비나 눈이 연속으로 예보된 시간대는 언제입니까?
          mcp_projection:
            schema_version: mcp-product-projection/v1
            operation:
              id: weather.find_precipitation_windows
              approval_status: approved
              execution_mode: catalog_only
            question_examples:
              - 서울역에서 비나 눈이 이어질 것으로 예보된 시간대는 언제인가요?
              - 오늘 여의도공원에 강수 형태가 예보된 연속 구간이 있나요?
              - 이 장소의 다음 강수 예보 시작과 종료 시각은 언제인가요?
            empty_result:
              state: valid_empty
              code: no_upcoming_precipitation_forecast
              message_ko: 현재 수집된 유효 단기예보에는 향후 강수(비·눈) 구간이 없습니다.
          grain: place_id와 window_start_at마다 한 행 — 명시적으로 강수 형태가 예보된 연속 시간 구간.
          primary_key: [product_row_id]
          publication_mode: snapshot
          zero_policy: allow
          publication_trigger:
            schedule_cron: "0 * * * *"
          event_time: window_start_at
          freshness_field: forecast_collected_at_max
          freshness_slo_minutes: 240
          empty_result_freshness:
            relation: gold_weather_place_hourly_outlook
            field: forecast_collected_at_max
          retention_or_horizon: 최신 KMA 예보가 제공하는 미래 구간만 매 게시 시점에 교체합니다.
          shape: event
          source_evidence:
            - source_id: kma_vilage_fcst
              source_url: https://www.data.go.kr/data/15084084/openapi.do
              license: 공공누리 제1유형(출처표시)
              license_url: https://www.kogl.or.kr/info/licenseType1.do
              redistribution: allowed_with_attribution
              attribution: 기상청
              rights_checked_at: "2026-08-06"
          usage_patterns:
            - pattern_id: precipitation_windows_for_place
              question_ko: 특정 장소에서 비나 눈이 연속으로 예보된 시간 구간은 언제입니까?
              axes: 장소 필터 — 강수 시작 시각 ASC
              requires: [select_columns, filter_set, sort]
              allow_empty: true
              verified_rows: 2
              verified_at: "2026-08-05T14:39:11Z"
              verified_publication_id: "962864413564452f960be7c075b0bad1"
              sql: |
                -- :place_id='seoul_admd_1114054000'
                SELECT place_id, window_start_at, window_end_at
                FROM gold_weather_place_precipitation_window
                WHERE place_id = :place_id
                ORDER BY window_start_at ASC
            - pattern_id: next_precipitation_window_for_place
              question_ko: 특정 장소의 다음 강수 예보 구간은 언제입니까?
              axes: 장소·기준 시각 필터 — 강수 시작 시각 ASC, 1건
              requires: [select_columns, filter_set, filter_range, sort]
              allow_empty: true
              verified_rows: 1
              verified_at: "2026-08-05T14:39:11Z"
              verified_publication_id: "962864413564452f960be7c075b0bad1"
              param_defaults: { as_of_at: { rel: "0d", as: datetime } }
              sql: |
                -- :place_id='seoul_admd_1114054000', :as_of_at='2026-07-30 00:00:00'
                SELECT place_id, window_start_at, window_end_at
                FROM gold_weather_place_precipitation_window
                WHERE place_id = :place_id AND window_start_at >= :as_of_at
                ORDER BY window_start_at ASC
                LIMIT 1
            - pattern_id: windows_starting_in_range
              question_ko: 특정 시간 범위에 시작하는 강수 예보 구간은 무엇입니까?
              axes: 강수 시작 시각 범위 필터 — 시간 ASC
              requires: [select_columns, filter_range, sort]
              param_defaults: { n: 100, from_at: { rel: "0d", as: datetime }, to_at: { rel: "+2d", as: datetime } }
              allow_empty: true
              verified_rows: 100
              verified_at: "2026-08-05T14:39:11Z"
              verified_publication_id: "962864413564452f960be7c075b0bad1"
              sql: |
                -- :from_at='2026-07-30 00:00:00', :to_at='2026-08-06 00:00:00', :n=100
                SELECT place_id, window_start_at, window_end_at
                FROM gold_weather_place_precipitation_window
                WHERE window_start_at >= :from_at AND window_start_at < :to_at
                ORDER BY window_start_at ASC, place_id
                LIMIT :n
            - pattern_id: windows_overlapping_visit_window
              question_ko: 특정 방문 시간 범위와 겹치는 강수 예보 구간은 무엇입니까?
              axes: 방문 시간 겹침 필터 — 강수 시작 시각 ASC
              requires: [select_columns, filter_range, sort]
              param_defaults: { n: 100, from_at: { rel: "0d", as: datetime }, to_at: { rel: "+2d", as: datetime } }
              allow_empty: true
              verified_rows: 100
              verified_at: "2026-08-05T14:39:11Z"
              verified_publication_id: "962864413564452f960be7c075b0bad1"
              sql: |
                -- :to_at='2026-08-06 00:00:00', :from_at='2026-07-30 00:00:00', :n=100
                SELECT place_id, window_start_at, window_end_at
                FROM gold_weather_place_precipitation_window
                WHERE window_start_at < :to_at AND window_end_at >= :from_at
                ORDER BY window_start_at ASC, place_id
                LIMIT :n
            - pattern_id: longest_precipitation_windows
              question_ko: 예보된 강수 지속 시간이 가장 긴 장소·시간 구간은 무엇입니까?
              axes: 강수 지속 시간 정렬 — 지속 시간 DESC
              requires: [select_columns, sort]
              param_defaults: { n: 20 }
              allow_empty: true
              verified_rows: 20
              verified_at: "2026-08-05T14:39:11Z"
              verified_publication_id: "962864413564452f960be7c075b0bad1"
              sql: |
                -- :n=20
                SELECT place_id, window_start_at, window_end_at,
                       cast((julianday(window_end_at) - julianday(window_start_at)) * 24 as integer) + 1 AS duration_hours
                FROM gold_weather_place_precipitation_window
                ORDER BY duration_hours DESC, window_start_at ASC
                LIMIT :n
            - pattern_id: long_precipitation_windows_for_place
              question_ko: 특정 장소에서 지정한 시간보다 길게 이어지는 강수 예보 구간은 무엇입니까?
              axes: 장소·지속 시간 하한 필터 — 지속 시간 DESC
              requires: [select_columns, filter_set, filter_range, sort]
              param_defaults: { min_duration_hours: 1 }
              allow_empty: true
              verified_rows: 2
              verified_at: "2026-08-05T14:39:11Z"
              verified_publication_id: "962864413564452f960be7c075b0bad1"
              sql: |
                -- :place_id='seoul_admd_1114054000', :min_duration_hours=1
                SELECT place_id, window_start_at, window_end_at,
                       cast((julianday(window_end_at) - julianday(window_start_at)) * 24 as integer) + 1 AS duration_hours
                FROM gold_weather_place_precipitation_window
                WHERE place_id = :place_id
                  AND cast((julianday(window_end_at) - julianday(window_start_at)) * 24 as integer) + 1 >= :min_duration_hours
                ORDER BY duration_hours DESC, window_start_at ASC
            - pattern_id: latest_starting_precipitation_windows
              question_ko: 가장 늦게 시작하는 강수 예보 구간은 무엇입니까?
              axes: 강수 시작 시각 정렬 — window_start_at DESC
              requires: [select_columns, sort]
              param_defaults: { n: 20 }
              allow_empty: true
              verified_rows: 20
              verified_at: "2026-08-05T14:39:11Z"
              verified_publication_id: "962864413564452f960be7c075b0bad1"
              sql: |
                -- :n=20
                SELECT place_id, window_start_at, window_end_at
                FROM gold_weather_place_precipitation_window
                ORDER BY window_start_at DESC, place_id
                LIMIT :n
            - pattern_id: precipitation_window_count_by_place
              question_ko: 특정 시간 범위에서 장소별 강수 예보 구간 수는 얼마입니까?
              axes: 강수 시작 시각 범위 집계 — 구간 수 DESC
              requires: [select_columns, filter_range, aggregate, group_by, sort]
              param_defaults: { n: 100, from_at: { rel: "0d", as: datetime }, to_at: { rel: "+2d", as: datetime } }
              allow_empty: true
              verified_rows: 100
              verified_at: "2026-08-05T14:39:11Z"
              verified_publication_id: "962864413564452f960be7c075b0bad1"
              sql: |
                -- :from_at='2026-07-30 00:00:00', :to_at='2026-08-06 00:00:00', :n=100
                SELECT place_id, count(*) AS precipitation_window_count
                FROM gold_weather_place_precipitation_window
                WHERE window_start_at >= :from_at AND window_start_at < :to_at
                GROUP BY place_id
                ORDER BY precipitation_window_count DESC, place_id
                LIMIT :n
            - pattern_id: "precipitation_edge_hour_distribution"
              question_ko: "예보상 강수가 시작(또는 종료)되는 시각별로 장소가 몇 곳입니까?"
              axes: "시작/종료 시각 축 전환 집계 — 장소 수 DESC"
              verified_rows: 0
              verified_at: "2026-08-10T11:18:06Z"
              verified_publication_id: "1a72439a644e44ea9ce869d30fce0d81"
              insight_sample_ko: "강수 시작 시각(edge=start) 기준 18시에 시작하는 장소가 135곳으로 가장 많습니다."
              sql: |
                -- :edge=start
                SELECT CASE :edge WHEN 'end' THEN window_end_at ELSE window_start_at END AS window_edge_at,
                       count(*) AS place_count
                FROM gold_weather_place_precipitation_window
                GROUP BY CASE :edge WHEN 'end' THEN window_end_at ELSE window_start_at END
                ORDER BY place_count DESC, window_edge_at ASC
              requires: [select_columns, aggregate, group_by, sort]
              allow_empty: true   # 무강수 기간 0행 정상(강수 구간 축)
            - pattern_id: "active_precipitation_at_instant"
              question_ko: "특정 시각에 강수 예보 구간이 진행 중인(그 시각을 포함하는) 장소는 어디입니까?"
              axes: "기준 시각 포함 필터 — 장소 ID ASC"
              verified_rows: 0
              verified_at: "2026-08-10T11:18:06Z"
              verified_publication_id: "1a72439a644e44ea9ce869d30fce0d81"
              insight_sample_ko: "2026-08-08 17시 시점에 강수가 진행 중인 장소는 38곳입니다(예: seoul_admd_1154567000)."
              sql: |
                -- :at=2026-08-08 17:00:00, :n=100
                SELECT place_id, window_start_at, window_end_at
                FROM gold_weather_place_precipitation_window
                WHERE window_start_at <= :at AND window_end_at >= :at
                ORDER BY place_id
                LIMIT :n
              requires: [select_columns, filter_range, sort]
              allow_empty: true   # 무강수 기간 0행 정상(강수 구간 축)
              param_defaults: { n: 100 , at: { rel: "0d", as: datetime } }
            - pattern_id: "precipitation_windows_by_edge_in_range"
              question_ko: "특정 시간 범위에 강수가 시작(또는 종료)되는 구간은 무엇입니까?"
              axes: "시작/종료 시각 축 전환·시간 범위 필터 — 해당 시각 ASC"
              verified_rows: 0
              verified_at: "2026-08-10T11:18:06Z"
              verified_publication_id: "1a72439a644e44ea9ce869d30fce0d81"
              insight_sample_ko: "강수 종료(edge=end) 기준 16~18시에 그치는 장소는 45곳이며, 가장 이른 종료는 16시(seoul_admd_1165066000)입니다."
              sql: |
                -- :edge=end, :from_at=2026-08-08 16:00:00, :to_at=2026-08-08 18:00:00, :n=100
                SELECT place_id, window_start_at, window_end_at
                FROM gold_weather_place_precipitation_window
                WHERE (CASE :edge WHEN 'end' THEN window_end_at ELSE window_start_at END) >= :from_at
                  AND (CASE :edge WHEN 'end' THEN window_end_at ELSE window_start_at END) < :to_at
                ORDER BY (CASE :edge WHEN 'end' THEN window_end_at ELSE window_start_at END) ASC, place_id
                LIMIT :n
              requires: [select_columns, filter_range, sort]
              allow_empty: true   # 무강수 기간 0행 정상(강수 구간 축)
              param_defaults: { n: 100, from_at: { rel: "0d", as: datetime }, to_at: { rel: "+2d", as: datetime } }
            - pattern_id: "precipitation_duration_distribution"
              question_ko: "예보된 강수 구간의 지속 시간(시간 수)별 장소 수 분포는 어떻습니까?"
              axes: "지속 시간 집계 — 지속 시간 ASC"
              verified_rows: 0
              verified_at: "2026-08-10T11:18:06Z"
              verified_publication_id: "1a72439a644e44ea9ce869d30fce0d81"
              insight_sample_ko: "지속 1시간 강수 구간이 146곳으로 가장 많고, 2시간 구간은 37곳입니다."
              sql: |
                SELECT cast((julianday(window_end_at) - julianday(window_start_at)) * 24 as integer) + 1 AS duration_hours,
                       count(*) AS place_count
                FROM gold_weather_place_precipitation_window
                GROUP BY duration_hours
                ORDER BY duration_hours ASC
              requires: [select_columns, aggregate, group_by, sort]
              allow_empty: true   # 무강수 기간 0행 정상(강수 구간 축)
            - pattern_id: "active_place_count_by_hour"
              question_ko: "예보 시각대별로 강수 예보 구간이 진행 중인 장소 수는 어떻게 변합니까?"
              axes: "예보 시각 그리드 자기조인 집계 — 시각 ASC 시계열"
              verified_rows: 0
              verified_at: "2026-08-10T11:18:06Z"
              verified_publication_id: "1a72439a644e44ea9ce869d30fce0d81"
              insight_sample_ko: "16시 시점 강수 진행 장소는 44곳으로, 시각대별 강수 진행 장소 수 곡선의 시작점입니다."
              sql: |
                WITH hrs AS (
                  SELECT window_start_at AS h FROM gold_weather_place_precipitation_window
                  UNION
                  SELECT window_end_at FROM gold_weather_place_precipitation_window
                )
                SELECT hrs.h AS hour_at, count(*) AS active_place_count
                FROM hrs
                JOIN gold_weather_place_precipitation_window w
                  ON w.window_start_at <= hrs.h AND w.window_end_at >= hrs.h
                GROUP BY hrs.h
                ORDER BY hrs.h ASC
              requires: [select_columns, subquery, join, aggregate, group_by, sort]
              allow_empty: true   # 무강수 기간 0행 정상(강수 구간 축)
            - pattern_id: "precipitation_windows_for_place_set"
              question_ko: "지정한 여러 장소들의 강수 예보 구간을 한 번에 보고 싶습니다."
              axes: "다중 장소 IN 필터 — 강수 시작 시각 ASC"
              verified_rows: 0
              verified_at: "2026-08-10T11:18:06Z"
              verified_publication_id: "1a72439a644e44ea9ce869d30fce0d81"
              insight_sample_ko: "지정한 3개 장소 중 seoul_admd_1165051000은 16~17시에 강수가 예보되어 있습니다."
              sql: |
                -- :places=["seoul_admd_1165051000","seoul_admd_1138065000","seoul_admd_1117057000"], :n=100
                SELECT place_id, window_start_at, window_end_at
                FROM gold_weather_place_precipitation_window
                WHERE place_id IN (SELECT value FROM json_each(:places))
                ORDER BY window_start_at ASC, place_id
                LIMIT :n
              requires: [select_columns, filter_set, sort]
              allow_empty: true   # 무강수 기간 0행 정상(강수 구간 축)
              param_defaults: { n: 100 }
            - pattern_id: "precipitation_windows_in_gu"
              question_ko: "특정 자치구에서 강수가 예보된 동과 그 시간 구간은 무엇입니까?"
              axes: "자치구 필터(장소 라벨 조인) — 강수 시작 시각 ASC"
              verified_rows: 0
              verified_at: "2026-08-10T11:18:06Z"
              verified_publication_id: "1a72439a644e44ea9ce869d30fce0d81"
              insight_sample_ko: "자치구 11500(강서구)에서 강수가 예보된 동은 20곳이며, 첫 구간은 18시에 시작합니다."
              sql: |
                -- :gu_code=11500, :n=100
                SELECT w.place_id, o.place_name, o.admin_dong, o.gu, w.window_start_at, w.window_end_at
                FROM gold_weather_place_precipitation_window w
                JOIN gold_weather_place_current_outlook o ON o.place_id = w.place_id
                WHERE o.gu_code = :gu_code
                ORDER BY w.window_start_at ASC, o.place_name
                LIMIT :n
              requires: [select_columns, join, filter_set, sort]
              allow_empty: true   # 무강수 기간 0행 정상(강수 구간 축)
              param_defaults: { n: 100 }
            - pattern_id: "precipitation_window_place_count_by_gu"
              question_ko: "자치구별로 강수 구간이 예보된 동 수와 가장 이른 시작·가장 늦은 종료 시각은 얼마입니까?"
              axes: "자치구 집계(장소 라벨 조인) — 동 수 DESC"
              verified_rows: 0
              verified_at: "2026-08-10T11:18:06Z"
              verified_publication_id: "1a72439a644e44ea9ce869d30fce0d81"
              insight_sample_ko: "강수 구간이 있는 자치구는 14곳이며, 가장 많은 곳은 자치구 11500(강서구)으로 20개 동입니다."
              sql: |
                -- :n=25
                SELECT o.gu_code, o.gu, count(*) AS place_count,
                       min(w.window_start_at) AS earliest_window_start_at,
                       max(w.window_end_at) AS latest_window_end_at
                FROM gold_weather_place_precipitation_window w
                JOIN gold_weather_place_current_outlook o ON o.place_id = w.place_id
                GROUP BY o.gu_code, o.gu
                ORDER BY place_count DESC, o.gu_code
                LIMIT :n
              requires: [select_columns, join, aggregate, group_by, sort]
              allow_empty: true   # 무강수 기간 0행 정상(강수 구간 축)
              param_defaults: { n: 25 }
          public_projection:
            schema_version: "1.2.0"
            columns:
              - product_row_id
              - place_id
              - place_name
              - admin_dong_code
              - admin_dong
              - gu_code
              - gu
              - window_start_at
              - window_end_at
              - precipitation_hour_count
              - precip_prob_max_pct
              - pcp_max_mm
              - sno_max_cm
              - forecast_issued_at_min
              - forecast_issued_at_max
              - forecast_collected_at_max
    columns:
      - name: product_row_id
        description: place_id와 강수 구간 시작시각을 직렬화한 식별자입니다.
        data_type: varchar
        tests: [not_null, unique]
        config:
