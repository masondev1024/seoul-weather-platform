# MacBook Weather-only runtime. Keep this project name distinct from the retired
# team stack so containers, networks, and volumes cannot overlap by accident.
name: seoul-weather-platform-mac

networks:
  elt_net:
    name: seoul-weather-platform-mac-net

# This restores a local Airflow image build after docker-compose.prod.yml pins
# the Windows deployment to an immutable image digest. Operational lineage is
# deliberately disabled on the personal runtime; provenance remains file based.
x-airflow-mac-runtime: &airflow-mac-runtime
  image: ask-seoul-weather-airflow:mac-local
  environment:
    AIRFLOW__OPENLINEAGE__DISABLED: "true"
    ASK_SEOUL_DBT_OPENLINEAGE_ENABLED: "false"
    ASK_SEOUL_KMA_DAG_SCHEDULE: ""
    ASK_SEOUL_WEATHER_SERVING_SNAPSHOT_DAG_SCHEDULE: ""
    KMA_NUM_OF_ROWS: "2000"

services:
  trino:
    mem_limit: 5g
    environment:
      TRINO_TASK_CONCURRENCY: "2"
      TRINO_QUERY_MAX_MEMORY_PER_NODE: "800MB"
      TRINO_MEMORY_HEAP_HEADROOM_PER_NODE: "1500MB"
      TRINO_QUERY_MAX_MEMORY: "800MB"
      TRINO_QUERY_MAX_TOTAL_MEMORY: "1200MB"

  airflow-init:
    <<: *airflow-mac-runtime
    build:
      context: .
      dockerfile: Dockerfile.airflow
  airflow-apiserver:
    <<: *airflow-mac-runtime
    build: !reset null
  airflow-scheduler:
    <<: *airflow-mac-runtime
    build: !reset null
  airflow-dag-processor:
    <<: *airflow-mac-runtime
    build: !reset null
  airflow-triggerer:
    <<: *airflow-mac-runtime
    build: !reset null
