name: Weather Daily Quality

on:
  schedule:
    # KST 09:17; KST 21:43 retries a day whose report was not published.
    - cron: '17 0 * * *'
    - cron: '43 12 * * *'
  workflow_dispatch:
    inputs:
      refresh:
        description: Append a fresh quality evaluation while preserving an existing daily report
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: weather-daily-quality-publication
  cancel-in-progress: false

jobs:
  report:
    if: github.repository == 'masondev1024/seoul-weather-platform' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pages: write
    steps:
      - name: Checkout trusted source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: 3.11.15
      - name: Prepare report archive and skip completed day
        id: archive
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REFRESH_REPORT: ${{ inputs.refresh }}
        run: |
          args=()
          if [ "$REFRESH_REPORT" = "true" ]; then args+=(--refresh); fi
          python -m tools.weather_daily_quality_publish --prepare "${args[@]}" --checkout "$RUNNER_TEMP/weather-report-archive"
      - name: Install pinned read client
        if: steps.archive.outputs.already_published != 'true'
        run: python -m pip install boto3==1.43.0
      - name: Read bounded R2 collection evidence
        if: steps.archive.outputs.already_published != 'true'
        env:
          R2_ENDPOINT: ${{ secrets.WEATHER_QUALITY_R2_ENDPOINT }}
          R2_BUCKET_NAME: ${{ secrets.WEATHER_QUALITY_R2_BUCKET_NAME }}
          R2_ACCESS_KEY_ID: ${{ secrets.WEATHER_QUALITY_R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.WEATHER_QUALITY_R2_SECRET_ACCESS_KEY }}
        run: python -m tools.weather_daily_quality_cloud --output-dir "$RUNNER_TEMP/weather-public-report"
      - name: Show measured health in workflow summary
        if: steps.archive.outputs.already_published != 'true'
        run: cat "$RUNNER_TEMP/weather-public-report/"*.md >> "$GITHUB_STEP_SUMMARY"
      - name: Publish one real report per KST day
        if: steps.archive.outputs.already_published != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REFRESH_REPORT: ${{ inputs.refresh }}
        run: |
          args=()
          if [ "$REFRESH_REPORT" = "true" ]; then args+=(--refresh); fi
          python -m tools.weather_daily_quality_publish --publish "${args[@]}" --checkout "$RUNNER_TEMP/weather-report-archive" --output-dir "$RUNNER_TEMP/weather-public-report"
      - name: Request Pages refresh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" --jq '.status'
